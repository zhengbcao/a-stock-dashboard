<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>A股财报看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #1a1a2e; }

/* ===== 顶部 ===== */
.header {
  background: #f4f5f7;
  color: #1a1a2e; padding: 28px 32px; text-align: center;
  border-bottom: 1px solid #e2e8f0;
}
.header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #1a202c; }
.header .subtitle { font-size: 13px; color: #64748b; margin-bottom: 4px; }
.header .update-time { font-size: 12px; color: #a0aec0; }

/* ===== 筛选栏 ===== */
.toolbar {
  position: relative; z-index: 10;
  padding: 12px 32px; background: #fff; border-bottom: 1px solid #e2e8f0;
  display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
}
.toolbar input, .toolbar select {
  padding: 6px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 13px; outline: none;
}
.toolbar input:focus, .toolbar select:focus { border-color: #4a6cf7; box-shadow: 0 0 0 2px rgba(74,108,247,.15); }
.toolbar input { width: 200px; }
.toolbar .count { margin-left: auto; font-size: 13px; color: #718096; }

/* ===== 日期单选下拉 ===== */
.date-select {
  position: relative; display: inline-block;
}
.date-select .ds-btn {
  padding: 6px 14px; border: 1px solid #cbd5e0; border-radius: 6px;
  font-size: 13px; background: #fff; cursor: pointer;
  display: flex; align-items: center; gap: 6px; min-width: 130px;
  user-select: none; white-space: nowrap; transition: border-color .15s, box-shadow .15s;
}
.date-select .ds-btn:hover { border-color: #4a6cf7; }
.date-select.open .ds-btn { border-color: #4a6cf7; box-shadow: 0 0 0 2px rgba(74,108,247,.15); }
.date-select .ds-btn .arrow {
  font-size: 10px; color: #a0aec0; margin-left: auto;
  transition: transform .2s;
}
.date-select.open .ds-btn .arrow { transform: rotate(180deg); }
.date-select .ds-dropdown {
  display: none; position: absolute; top: calc(100% + 6px); left: 0;
  background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.10); z-index: 50;
  min-width: 168px; overflow: hidden;
  padding: 4px 0; animation: dsSlide .15s ease;
}
@keyframes dsSlide { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.date-select.open .ds-dropdown { display: block; }

/* ===== 多选下拉项（日期 / 板块 共用） ===== */
.ms-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px; margin: 0; cursor: pointer;
  font-size: 13px; color: #4a5568; text-align: left;
  white-space: nowrap; transition: background .1s;
}
.ms-item:hover { background: #f0f4ff; }
.ms-item input[type="checkbox"] {
  flex: 0 0 14px; width: 14px; height: 14px; margin: 0;
  cursor: pointer; accent-color: #4a6cf7;
}
.ms-item span {
  flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ms-divider { height: 1px; background: #edf2f7; margin: 4px 0; }
.ms-all { color: #4a6cf7; font-weight: 600; }

/* ===== 板块多选下拉 ===== */
.board-select { position: relative; display: inline-block; }
.board-select .bs-btn {
  padding: 6px 14px; border: 1px solid #cbd5e0; border-radius: 6px;
  font-size: 13px; background: #fff; cursor: pointer;
  display: flex; align-items: center; gap: 6px; min-width: 120px;
  user-select: none; white-space: nowrap; transition: border-color .15s, box-shadow .15s;
}
.board-select .bs-btn:hover { border-color: #4a6cf7; }
.board-select.open .bs-btn { border-color: #4a6cf7; box-shadow: 0 0 0 2px rgba(74,108,247,.15); }
.board-select .bs-btn .arrow { font-size: 10px; color: #a0aec0; margin-left: auto; transition: transform .2s; }
.board-select.open .bs-btn .arrow { transform: rotate(180deg); }
.board-select .bs-dropdown {
  display: none; position: absolute; top: calc(100% + 6px); left: 0;
  background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.10); z-index: 50;
  min-width: 150px; overflow: hidden; padding: 4px 0; animation: dsSlide .15s ease;
}
.board-select.open .bs-dropdown { display: block; }

/* ===== 一键复制到 Excel 按钮 ===== */
.copy-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 16px; background: #4a6cf7; color: #fff; border: none;
  border-radius: 6px; font-size: 13px; cursor: pointer;
  transition: background .2s, transform .1s; user-select: none; white-space: nowrap;
}
.copy-btn:hover { background: #3b5bdb; }
.copy-btn:active { transform: scale(0.97); }
.copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
.copy-toast {
  padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
  opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap;
}
.copy-toast.show { opacity: 1; }
.copy-toast.ok { background: #c6f6d5; color: #276749; }
.copy-toast.fail { background: #fed7d7; color: #9b2c2c; }

/* ===== 分页 ===== */
.pager {
  display: flex; justify-content: center; align-items: center;
  gap: 6px; flex-wrap: wrap; padding: 4px 32px 28px;
}
.pager button {
  min-width: 34px; padding: 6px 10px; font-size: 13px;
  border: 1px solid #cbd5e0; background: #fff; color: #4a5568;
  border-radius: 6px; cursor: pointer; transition: all .15s;
}
.pager button:hover:not(:disabled):not(.active) { border-color: #4a6cf7; color: #4a6cf7; }
.pager button.active { background: #4a6cf7; border-color: #4a6cf7; color: #fff; font-weight: 600; }
.pager button:disabled { opacity: .45; cursor: not-allowed; }
.pager .pg-info { margin: 0 10px; font-size: 13px; color: #718096; white-space: nowrap; }
.pager .pg-gap { color: #a0aec0; padding: 0 2px; }

/* 日期下拉：整季可能有数十个公告日，限高滚动 */
.date-select .ds-dropdown { max-height: 320px; overflow-y: auto; }

/* ===== 表格容器 ===== */
.table-wrap { overflow-x: auto; padding: 16px 32px 32px; }
table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  background: #fff; border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); font-size: 13px;
}

/* 一级分组行 */
thead tr.group-header th {
  text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 1px;
  padding: 9px 8px; white-space: nowrap;
  border-bottom: none;
  position: sticky; top: 0; z-index: 4;
  user-select: none;
}
thead tr.group-header th.grp-base {
  background: linear-gradient(180deg, #f1f3f9 0%, #e8ebf4 100%); color: #4a5568;
  border-radius: 12px 0 0 0;
}
thead tr.group-header th.grp-rev {
  background: linear-gradient(180deg, #fff0f0 0%, #ffe0e0 100%); color: #c53030;
}
thead tr.group-header th.grp-ded {
  background: linear-gradient(180deg, #eefaf2 0%, #d4f5de 100%); color: #276749;
}
thead tr.group-header th.grp-prof {
  background: linear-gradient(180deg, #eef6ff 0%, #d9ebfc 100%); color: #2b6cb0;
  border-radius: 0 12px 0 0;
}

/* 二级列头行 */
thead tr.col-header th {
  background: #fafbfe; color: #64748b;
  text-align: center; font-size: 11px; font-weight: 600;
  padding: 7px 6px; white-space: nowrap;
  border-bottom: 2px solid #e2e8f0;
  border-top: 1px solid rgba(0,0,0,.04);
  position: sticky; top: 33px; z-index: 3;
  cursor: pointer; user-select: none;
  transition: background .15s;
}
thead tr.col-header th:hover { background: #eef0f8; }
thead tr.col-header th.no-sort { cursor: default; }
thead tr.col-header th.no-sort:hover { background: #fafbfe; }

/* 分组间分隔线 */
thead tr.col-header th.col-first {
  border-left: 2px solid #e2e8f0;
}

/* 排序图标 */
.sort-icon {
  display: inline-block; margin-left: 2px;
  font-size: 9px; color: #c0c8d8; transition: transform .15s, color .15s;
  vertical-align: middle;
}
.sort-icon.desc { color: #4a6cf7; transform: rotate(0deg); }
.sort-icon.asc  { color: #4a6cf7; transform: rotate(180deg); }

/* 数据行 */
tbody tr { border-bottom: 1px solid #f0f0f0; transition: background .15s; }
tbody tr:hover { background: #f7faff; }
td { padding: 12px 8px; vertical-align: middle; white-space: nowrap; }
td.code { font-family: 'Menlo','Consolas',monospace; font-weight: 500; color: #2d3748; }
td.spark-td { padding: 8px 6px; }
td.pct-td { text-align: right; font-weight: 600; font-size: 12px; min-width: 68px; }
td.col-first { border-left: 2px solid #f0f0f0; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge-增长 { background: #c6f6d5; color: #22543d; }
.badge-下降 { background: #fed7d7; color: #9b2c2c; }
.badge-扭亏 { background: #c6f6d5; color: #276749; }
.badge-首亏 { background: #fed7d7; color: #9b2c2c; }
.badge-增亏 { background: #fed7d7; color: #9b2c2c; }
.badge-减亏 { background: #fefcbf; color: #975a16; }
.badge-- { background: #e2e8f0; color: #718096; }

.pct-pos { color: #e53e3e; }
.pct-neg { color: #38a169; }
.pct-na  { color: #cbd5e0; }

svg.spark { display: block; }

/* 全局 Tooltip */
#globalTip {
  display: none; position: fixed;
  background: #1a202c; color: #fff;
  padding: 10px 14px; border-radius: 8px;
  font-size: 12px; line-height: 1.7; white-space: nowrap;
  z-index: 99999; pointer-events: none;
  box-shadow: 0 6px 20px rgba(0,0,0,.3);
}
#globalTip::after {
  content: ''; position: absolute;
  left: 50%; transform: translateX(-50%);
  border: 6px solid transparent;
}
#globalTip.arrow-bottom::after { top: 100%; border-top-color: #1a202c; }
#globalTip.arrow-top::after    { bottom: 100%; border-bottom-color: #1a202c; }
</style>

/* ---------- 格式化 ---------- */
function formatNumTip(v) {
  if (v === null || v === undefined) return '-';
  const abs = Math.abs(v);
  if (abs >= 1e8) return (v / 1e8).toFixed(1) + '亿';
  if (abs >= 1e4) return Math.round(v / 1e4) + '万';
  return v.toFixed(0);
}

/* SVG 斜线阴影 pattern 定义 */
const DEFS = '<defs>' +
  '<pattern id="hatchRed" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(45)">' +
    '<line x1="0" y1="0" x2="0" y2="3" stroke="#e53e3e" stroke-width="2" stroke-opacity="0.6"/>' +
  '</pattern>' +
  '<pattern id="hatchGreen" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(45)">' +
    '<line x1="0" y1="0" x2="0" y2="3" stroke="#38a169" stroke-width="2" stroke-opacity="0.6"/>' +
  '</pattern>' +
'</defs>';

function sparkSVG(values) {
  var W = 130, H = 44, pad = 2;
  var n = values.length;
  var valid = values.filter(function(v) { return v !== null; });
  if (valid.length === 0) return '<svg class="spark" width="'+W+'" height="'+H+'"></svg>';
  var maxAbs = Math.max.apply(null, valid.map(Math.abs).concat([1e-9]));
  var barW = Math.max(3, (W - pad * 2) / n - 2);
  var gap = (W - pad * 2 - barW * n) / Math.max(n - 1, 1);
  var midY = H / 2;
  var scaleY = (H / 2 - 3);

  var lastIdx = -1;
  for (var i = n - 1; i >= 0; i--) { if (values[i] !== null) { lastIdx = i; break; } }

  var bars = DEFS;
  for (var i = 0; i < n; i++) {
    var v = values[i];
    if (v === null) continue;
    var x = pad + i * (barW + gap);
    var h = Math.max(1, Math.abs(v) / maxAbs * scaleY);
    var y = v >= 0 ? midY - h : midY;
    var solidColor = v >= 0 ? '#e53e3e' : '#38a169';

    if (i === lastIdx) {
      var patternId = v >= 0 ? 'hatchRed' : 'hatchGreen';
      bars += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" fill="url(#'+patternId+')" stroke="'+solidColor+'" stroke-width="1.2" rx="1"/>';
    } else {
      bars += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" fill="'+solidColor+'" rx="1"/>';
    }
  }
  bars += '<line x1="'+pad+'" y1="'+midY+'" x2="'+(W-pad)+'" y2="'+midY+'" stroke="#cbd5e0" stroke-width="0.5" stroke-dasharray="2,2"/>';
  return '<svg class="spark" width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">'+bars+'</svg>';
}

/* Tooltip 用 body 浮层 */
var tipEl = document.getElementById('globalTip');
function showTip(e, html) {
  tipEl.innerHTML = html;
  tipEl.style.display = 'block';
  var rect = e.currentTarget.getBoundingClientRect();
  var tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  var left = rect.left + rect.width / 2 - tw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
  if (rect.top - th - 10 > 0) {
    tipEl.style.top = (rect.top - th - 10) + 'px';
    tipEl.className = 'arrow-bottom';
  } else {
    tipEl.style.top = (rect.bottom + 10) + 'px';
    tipEl.className = 'arrow-top';
  }
  tipEl.style.left = left + 'px';
}
function hideTip() { tipEl.style.display = 'none'; }

function buildTooltipHTML(values, labels) {
  var lines = [];
  for (var i = 0; i < labels.length; i++) {
    lines.push(labels[i] + ': ' + formatNumTip(values[i]));
  }
  return lines.join('<br>');
}

function sparkCell(sparkData) {
  var svg = sparkSVG(sparkData);
  var encoded = encodeURIComponent(JSON.stringify(sparkData));
  return '<div class="spark-wrap" data-spark="'+encoded+'">' + svg + '</div>';
}

function pctCell(val) {
  if (val === null || val === undefined) return '<span class="pct-na">-</span>';
  var cls = val > 0 ? 'pct-pos' : (val < 0 ? 'pct-neg' : 'pct-na');
  var sign = val > 0 ? '+' : '';
  return '<span class="' + cls + '">' + sign + val.toFixed(1) + '%</span>';
}

/* 排序 — 默认按发布日期降序 */
var sortCol = 'pub_date', sortState = 'desc';
var data = RAW_DATA.slice();

/* 日期多选状态（默认全选，倒序展示） */
var ALL_DATES = Array.from(new Set(RAW_DATA.map(function(r) { return r.pub_date; })))
                     .sort(function(a, b) { return b.localeCompare(a); });
var selectedDates = new Set(ALL_DATES);

/* 板块多选状态（默认全选） */
var ALL_BOARDS = ['主板', '创业板', '科创板', '北交所'];
var selectedBoards = new Set(ALL_BOARDS);

function classifyBoard(code) {
  code = String(code);
  if (code.slice(0, 3) === '688' || code.slice(0, 3) === '689') return '科创板';
  if (code.slice(0, 3) === '300' || code.slice(0, 3) === '301') return '创业板';
  if (code.slice(0, 3) === '920') return '北交所';
  return '主板';
}

/* 当前视图（随筛选与排序更新，供一键复制使用） */
var currentView = [];

/* 分页状态 */
var PAGE_SIZE = 100;
var currentPage = 1;

function render() {
  var search = document.getElementById('search').value.toLowerCase();
  var typeF = document.getElementById('typeFilter').value;
  var indF = document.getElementById('industryFilter').value;
  var filtered = data.filter(function(r) {
    if (search && !(r.code.toLowerCase().indexOf(search) >= 0 || r.name.toLowerCase().indexOf(search) >= 0 || (r.industry||'').toLowerCase().indexOf(search) >= 0)) return false;
    if (typeF && r.type !== typeF) return false;
    if (indF && r.industry !== indF) return false;
    if (!selectedDates.has(r.pub_date)) return false;
    if (!selectedBoards.has(classifyBoard(r.code))) return false;
    return true;
  });

  if (sortCol && sortState) {
    var asc = sortState === 'asc';
    filtered.sort(function(a, b) {
      var va = a[sortCol], vb = b[sortCol];
      if (va === null || va === undefined) va = asc ? Infinity : -Infinity;
      if (vb === null || vb === undefined) vb = asc ? Infinity : -Infinity;
      if (typeof va === 'string') return asc ? va.localeCompare(vb) : vb.localeCompare(va);
      return asc ? va - vb : vb - va;
    });
  }

  currentView = filtered;

  var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  var startIdx = (currentPage - 1) * PAGE_SIZE;
  var pageRows = filtered.slice(startIdx, startIdx + PAGE_SIZE);

  var tbody = document.getElementById('tbody');
  tbody.innerHTML = pageRows.map(function(r) {
    var badgeCls = 'badge badge-' + r.type;
    return '<tr>'
      + '<td class="code">' + r.code + '</td>'
      + '<td>' + r.name + '</td>'
      + '<td>' + (r.industry || '-') + '</td>'
      + '<td>' + r.pub_date + '</td>'
      + '<td><span class="' + badgeCls + '">' + r.type + '</span></td>'
      + '<td class="spark-td col-first">' + sparkCell(r.rev_spark) + '</td>'
      + '<td class="pct-td">' + pctCell(r.rev_yoy) + '</td>'
      + '<td class="pct-td">' + pctCell(r.rev_qoq) + '</td>'
      + '<td class="spark-td col-first">' + sparkCell(r.ded_spark) + '</td>'
      + '<td class="pct-td">' + pctCell(r.ded_yoy) + '</td>'
      + '<td class="pct-td">' + pctCell(r.ded_qoq) + '</td>'
      + '<td class="spark-td col-first">' + sparkCell(r.prof_spark) + '</td>'
      + '<td class="pct-td">' + pctCell(r.prof_yoy) + '</td>'
      + '<td class="pct-td">' + pctCell(r.prof_qoq) + '</td>'
      + '</tr>';
  }).join('');
  var shownFrom = filtered.length ? (startIdx + 1) : 0;
  var shownTo = startIdx + pageRows.length;
  document.getElementById('countLabel').textContent =
    '共 ' + filtered.length + ' / ' + data.length + ' 只'
    + (filtered.length > PAGE_SIZE ? '（当前 ' + shownFrom + '-' + shownTo + '）' : '');

  document.querySelectorAll('.spark-wrap').forEach(function(wrap) {
    wrap.addEventListener('mouseenter', function(e) {
      var sparkData = JSON.parse(decodeURIComponent(this.dataset.spark));
      showTip(e, buildTooltipHTML(sparkData, QUARTER_LABELS));
    });
    wrap.addEventListener('mouseleave', hideTip);
  });

  renderPager(totalPages);
}

/* 分页器 */
function gotoPage(p) {
  currentPage = p;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPager(totalPages) {
  var el = document.getElementById('pager');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  var html = '';
  html += '<button ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="gotoPage(1)">首页</button>';
  html += '<button ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="gotoPage(' + (currentPage - 1) + ')">上一页</button>';

  // 页码窗口：当前页两侧各 2 页，首尾始终可见
  var pages = [];
  for (var i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) pages.push(i);
  }
  var prev = 0;
  pages.forEach(function(p) {
    if (prev && p - prev > 1) html += '<span class="pg-gap">…</span>';
    html += '<button class="' + (p === currentPage ? 'active' : '') + '" onclick="gotoPage(' + p + ')">' + p + '</button>';
    prev = p;
  });

  html += '<button ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="gotoPage(' + (currentPage + 1) + ')">下一页</button>';
  html += '<button ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="gotoPage(' + totalPages + ')">末页</button>';
  html += '<span class="pg-info">第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
  el.innerHTML = html;
}

/* 筛选/排序变更 → 回到第 1 页 */
function renderReset() {
  currentPage = 1;
  render();
}

(function() {
  var dropdown = document.getElementById('dsDropdown');
  var label = document.getElementById('dsLabel');
  var btn = document.getElementById('dsBtn');
  var container = document.getElementById('dateSelect');

  var allItem = document.createElement('label');
  allItem.className = 'ms-item ms-all';
  allItem.innerHTML = '<input type="checkbox" id="dsAll" checked><span>全部日期</span>';
  dropdown.appendChild(allItem);

  var divider = document.createElement('div');
  divider.className = 'ms-divider';
  dropdown.appendChild(divider);

  ALL_DATES.forEach(function(d) {
    var item = document.createElement('label');
    item.className = 'ms-item';
    item.innerHTML = '<input type="checkbox" class="ds-cb" value="' + d + '" checked><span>' + d + '</span>';
    dropdown.appendChild(item);
  });

  var allCb = document.getElementById('dsAll');
  var cbs = Array.prototype.slice.call(dropdown.querySelectorAll('.ds-cb'));

  function updateLabel() {
    if (selectedDates.size === ALL_DATES.length) label.textContent = '全部日期';
    else if (selectedDates.size === 0) label.textContent = '未选日期';
    else if (selectedDates.size === 1) label.textContent = Array.from(selectedDates)[0];
    else label.textContent = '日期 (' + selectedDates.size + ')';
  }

  function syncFromCbs() {
    selectedDates = new Set();
    cbs.forEach(function(cb) { if (cb.checked) selectedDates.add(cb.value); });
    allCb.checked = (selectedDates.size === ALL_DATES.length);
    allCb.indeterminate = (selectedDates.size > 0 && selectedDates.size < ALL_DATES.length);
    updateLabel();
    renderReset();
  }

  cbs.forEach(function(cb) { cb.addEventListener('change', syncFromCbs); });

  allCb.addEventListener('change', function() {
    cbs.forEach(function(cb) { cb.checked = allCb.checked; });
    syncFromCbs();
  });

  dropdown.addEventListener('click', function(e) { e.stopPropagation(); });

  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    container.classList.toggle('open');
  });
  document.addEventListener('click', function(e) {
    if (!container.contains(e.target)) container.classList.remove('open');
  });

  updateLabel();

/* 一键复制到 Excel（复制当前筛选 + 排序后的可见数据） */
function copyTable() {
  var toast = document.getElementById('copyToast');
  var rows = currentView || [];

  function flash(msg, ok) {
    toast.textContent = msg;
    toast.className = 'copy-toast show ' + (ok ? 'ok' : 'fail');
    setTimeout(function() { toast.className = 'copy-toast'; }, 2500);
  }

  if (rows.length === 0) { flash('✖ 无数据可复制', false); return; }

  var headers = ['代码', '名称', '行业', '日期', '类型',
    '营收同比(%)', '营收环比(%)', '扣非同比(%)', '扣非环比(%)', '归母同比(%)', '归母环比(%)'];
  var lines = [headers.join('\t')];
  function pv(v) { return (v === null || v === undefined) ? '' : v; }
  rows.forEach(function(r) {
    lines.push([
      r.code, r.name, (r.industry || ''), r.pub_date, r.type,
      pv(r.rev_yoy), pv(r.rev_qoq), pv(r.ded_yoy), pv(r.ded_qoq), pv(r.prof_yoy), pv(r.prof_qoq)
    ].join('\t'));
  });
  var text = lines.join('\n');

  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    flash(ok ? '✔ 已复制 ' + rows.length + ' 条记录' : '✖ 复制失败，请手动选择', ok);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      flash('✔ 已复制 ' + rows.length + ' 条记录', true);
    }).catch(fallback);
  } else {
    fallback();
  }
}

document.getElementById('search').addEventListener('input', renderReset);
document.getElementById('typeFilter').addEventListener('change', renderReset);
document.getElementById('industryFilter').addEventListener('change', renderReset);

/* 排序 */
function updateSortIcons() {
  document.querySelectorAll('.col-header .sort-icon').forEach(function(icon) {
    icon.classList.remove('desc', 'asc');
  });
  if (sortCol && sortState) {
    var activeTh = document.querySelector('.col-header th[data-col="'+sortCol+'"]');
    if (activeTh) {
      var icon = activeTh.querySelector('.sort-icon');
      if (icon) icon.classList.add(sortState);
    }
  }
}

document.querySelectorAll('.col-header th[data-col]').forEach(function(th) {
  var col = th.dataset.col;
  if (th.classList.contains('no-sort')) return;
  th.addEventListener('click', function() {
    if (sortCol === col) {
      if (sortState === 'desc') sortState = 'asc';
      else { sortCol = null; sortState = null; }
    } else {
      sortCol = col; sortState = 'desc';
    }
    updateSortIcons();
    renderReset();
  });
});

updateSortIcons();
render();
</script>
</body>
